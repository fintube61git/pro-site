name: Restricted Pages deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the tested public package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: restricted-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      actions_enabled: ${{ steps.source.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - name: Check publishing source without changing it
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type == "workflow"')" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages metadata
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Test source and package boundary
        run: python run_tests.py
      - name: Build the public allowlist
        run: python tools/build_public_site.py
      - name: Verify public files and local destinations
        run: python tools/check_public_site.py
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Test the packaged website
        env:
          SITE_ROOT: _site
        run: npm run test:e2e
      - name: Upload only the verified public package
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.actions_enabled == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified public package
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
